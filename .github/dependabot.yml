version: 2

updates:
  # npm dependencies — track package-lock.json (the canonical lockfile;
  # pnpm-lock.yaml is gitignored per .gitignore:27).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # The default branch is `main` (release), but agent work integrates on
    # `dev` — route dependency PRs there so they flow through the normal
    # dev → main merge, not straight at the release branch.
    target-branch: dev
    ignore:
      # mime ≥4 is ESM-only; dist/ is CommonJS and require()s it, so a
      # major bump crashes every CJS consumer (twice now: dependabot #211
      # → 0.25.0, dependabot #266 → 0.32.0, the second taking down the
      # orchestrator's dev environment). The smoke guard now reproduces
      # strict-CJS consumers (--no-experimental-require-module), but
      # don't keep opening PRs that can never merge. Remove both entries
      # only when dist ships ESM (or dual).
      - dependency-name: "mime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/mime"
        update-types: ["version-update:semver-major"]
      # Same class: uuid ≥12 dropped CJS; dist/recipe/items/guids.js
      # require()s it. v11 is the last dual-format major (v5 output is
      # identical across majors — RFC 4122).
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: scope
    # Let a freshly published version bake before bumping — cheap supply-chain
    # hardening. Does NOT delay security updates (those ship immediately).
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    groups:
      # Group every security update so they ship in a single PR — easier
      # to triage than one PR per advisory.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Keep the eslint stack together (incl. majors). eslint, @eslint/js, and
      # @typescript-eslint/* are peer-coupled — an eslint major needs its
      # companion bumps in the SAME PR or it fails the peer check. Listed before
      # dev-minor so the eslint packages match here first.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "eslint-*"
        update-types:
          - major
          - minor
          - patch
      # Group minor + patch dev-tree bumps. Production deps get their own
      # PR per package so reviewers can scrutinize.
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # GitHub Actions — keeps action SHAs (when we pin them) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
