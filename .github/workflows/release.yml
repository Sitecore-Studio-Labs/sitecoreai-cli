name: Release

on:
  push:
    branches:
      - main
  # Manual trigger. Two modes:
  #  - canary: build a snapshot of unreleased work and publish under the
  #    canary dist-tag (default — preserves the pre-existing dispatch
  #    contract).
  #  - move-dist-tag: point a dist-tag at an already-published version,
  #    e.g. to bring canary up to the current latest after a release
  #    without re-running the build.
  workflow_dispatch:
    inputs:
      mode:
        description: "Dispatch mode"
        required: true
        default: canary
        type: choice
        options:
          - canary
          - move-dist-tag
      version:
        description: "move-dist-tag only — published version to retag (e.g. 0.2.3)"
        required: false
        type: string
      tag:
        description: "move-dist-tag only — dist-tag to move (e.g. canary). 'latest' is refused."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # Stable release path only — never runs on a manual dispatch (that is
    # the `canary` job below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    environment: release
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. setup-node@v4
      # on Node 20 ships npm 10.x, so upgrade explicitly. When this workflow
      # moves to Node 22+ this step can be dropped.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally absent: this workflow authenticates to npm
          # via GitHub OIDC against the Trusted Publisher configured on
          # @sitecoreai-labs/sitecoreai-cli (workflow: release.yml,
          # environment: release). The Trusted Publisher config + the
          # id-token: write permission + environment: release on this job
          # are the three pieces npm verifies. Re-add NPM_TOKEN here only
          # if reverting to token-based auth.
          #
          # NPM_CONFIG_PROVENANCE still unset: provenance requires a public
          # source repo; Trusted Publishing does not.
          HUSKY: 0

  # Canary (pre-release) publish. Manually dispatched against a branch
  # (usually `dev`) to make an unreleased fix testable before it ships.
  # Publishes a snapshot version (e.g. 0.1.2-canary-20260519123456) under
  # the npm `canary` dist-tag — `latest` is untouched, no git tag, no
  # changelog entry. The pending changesets are NOT consumed: they still
  # flow through the stable `release` job above and become the official
  # version on `latest`.
  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'canary'
    runs-on: ubuntu-latest
    concurrency: canary
    # `environment: release` is required, not cosmetic: npm's Trusted
    # Publisher for this package verifies the workflow file AND the
    # environment, so the OIDC publish only succeeds from here.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1 — see the
      # release job above.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Require a pending changeset
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::error::No pending changesets — a canary needs at least one unreleased change to publish."
            exit 1
          fi

      - name: "Publish canary to npm (dist-tag: canary)"
        run: |
          npx changeset version --snapshot canary
          npx changeset publish --tag canary --no-git-tag

  # Point a dist-tag at an already-published version. Used to bring
  # canary up to current latest after a stable release (the canary job
  # above can't, since it requires pending changesets — by design).
  # Trusted Publishing covers `npm dist-tag` operations the same way it
  # covers `npm publish`, so this re-uses the same `environment: release`
  # OIDC contract — no extra Trusted Publisher config on npmjs.com.
  move-dist-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'move-dist-tag'
    runs-on: ubuntu-latest
    concurrency: dist-tag
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1 — see the
      # release job above.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Move dist-tag via OIDC
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$TAG" ]; then
            echo "::error::move-dist-tag mode requires both 'version' and 'tag' inputs"
            exit 1
          fi
          # SemVer-shaped version (allows prereleases like 0.2.3-canary-...).
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version: '$VERSION'"
            exit 1
          fi
          # Tag is a lowercase npm dist-tag identifier.
          if ! printf '%s' "$TAG" | grep -qE '^[a-z][a-z0-9-]*$'; then
            echo "::error::Invalid tag: '$TAG'"
            exit 1
          fi
          # Refuse to move 'latest' here — that bypasses the release flow
          # and can stealth-downgrade installs. Use the standard release
          # path if you need to retract or replace 'latest'.
          if [ "$TAG" = "latest" ]; then
            echo "::error::Refusing to move 'latest' via this workflow. Use the standard release flow."
            exit 1
          fi
          echo "Pointing dist-tag '$TAG' at @sitecoreai-labs/sitecoreai-cli@$VERSION…"
          npm dist-tag add "@sitecoreai-labs/sitecoreai-cli@$VERSION" "$TAG"
          echo "Current dist-tags:"
          npm view @sitecoreai-labs/sitecoreai-cli dist-tags
