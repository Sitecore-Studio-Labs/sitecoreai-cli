name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the two PMs the project actually uses: npm (release.yml,
        # package-lock.json) and pnpm (local dev). yarn + bun were dropped
        # — neither has a lockfile in the repo, and each adds an install-
        # script attack surface for zero meaningful coverage.
        package-manager: [npm, pnpm]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - name: Enable Corepack
        if: matrix.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ "${{ matrix.package-manager }}" = "npm" ]; then
            npm install
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  headless-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Non-TTY CLI test
        run: npm run test -- tests/unit/cli/cli-headless.test.ts
