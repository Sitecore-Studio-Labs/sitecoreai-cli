name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the two PMs the project actually uses: npm (release.yml,
        # package-lock.json) and pnpm (local dev). yarn + bun were dropped
        # — neither has a lockfile in the repo, and each adds an install-
        # script attack surface for zero meaningful coverage.
        package-manager: [npm, pnpm]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Enable Corepack
        if: matrix.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ "${{ matrix.package-manager }}" = "npm" ]; then
            npm install
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage ratchet gate
        # Fails when vitest.config.ts thresholds have dropped below the
        # baseline recorded in coverage-ratchet.json without an explicit
        # ALLOW_RATCHET_DOWN=1 override. Forces deliberate, reviewed
        # retreat instead of silent regression.
        run: node scripts/check-coverage-ratchet.cjs

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  lockfile-drift:
    # Devs use pnpm (pnpm-lock.yaml, gitignored) but the tracked lockfile —
    # the one the npm CI variant and the `npm ci`-based release consume — is
    # package-lock.json. This catches the drift where package.json changed and
    # the npm lock was not refreshed (e.g. a dep bumped via `pnpm install`
    # only). The reverse can't happen: pnpm-lock is regenerated fresh each run.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: package-lock.json is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' and commit the result — the tracked npm lock must follow package.json even though local dev uses pnpm."
            exit 1
          fi

  headless-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Non-TTY CLI test
        run: npm run test -- tests/unit/cli/cli-headless.test.ts
