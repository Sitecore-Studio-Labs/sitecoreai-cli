name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the two PMs the project actually uses: npm (release.yml,
        # package-lock.json) and pnpm (local dev). yarn + bun were dropped
        # — neither has a lockfile in the repo, and each adds an install-
        # script attack surface for zero meaningful coverage.
        package-manager: [npm, pnpm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable Corepack
        if: matrix.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ "${{ matrix.package-manager }}" = "npm" ]; then
            npm install
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  headless-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Non-TTY CLI test
        run: npm run test -- tests/unit/cli/cli-headless.test.ts
