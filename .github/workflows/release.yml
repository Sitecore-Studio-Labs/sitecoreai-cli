name: Release

on:
  push:
    branches:
      - main
  # Manual trigger for canary (pre-release) builds. Pick the branch to
  # build when dispatching — usually `dev`.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # Stable release path only — never runs on a manual dispatch (that is
    # the `canary` job below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    environment: release
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the post-release "Sync dev with released main" step
          # can merge main into dev — a shallow (depth-1) clone has no common
          # ancestor and fails with "refusing to merge unrelated histories".
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24's bundled npm is already >= 11.5.1, so it supports npm Trusted
      # Publishing (OIDC) out of the box. Do NOT self-upgrade npm here: running
      # `npm install -g npm@latest` drops npm's own bundled `sigstore` module,
      # which then breaks provenance generation during publish with
      # `MODULE_NOT_FOUND Cannot find module 'sigstore'`. The node-installed npm
      # ships sigstore intact.

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # Run our `version` script (changeset version + lockfile sync) rather
          # than the default bare `changeset version`, so the Version Packages
          # PR also updates package-lock.json. Without this the lockfile stays
          # at the old version and the `lockfile-drift` CI check goes red.
          version: npm run version
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally absent: this workflow authenticates to npm
          # via GitHub OIDC against the Trusted Publisher configured on
          # @sitecoreai-labs/sitecoreai-cli (workflow: release.yml,
          # environment: release). The Trusted Publisher config + the
          # id-token: write permission + environment: release on this job
          # are the three pieces npm verifies. Re-add NPM_TOKEN here only
          # if reverting to token-based auth.
          #
          # Provenance is ON — and npm would generate it here even without
          # this variable, because OIDC Trusted Publishing from a public repo
          # is sufficient on its own. (Versions published before this was
          # ever set, e.g. 0.38.11, already carry attestations; the older
          # comment claiming provenance was disabled was simply stale.)
          #
          # Setting it explicitly is still worth it: it states the intent in
          # the workflow, and it makes `npm publish` fail loudly if those
          # conditions ever stop holding rather than quietly shipping an
          # unsigned version. Each publish signs an attestation —
          # repo URL, commit SHA, workflow path — into Sigstore's public
          # transparency log. That record is permanent and per-version: it
          # cannot be retracted once a version ships.
          #
          # Do NOT add `npm install -g npm@latest` to this job. It replaces
          # the node-bundled npm with a copy that has no bundled `sigstore`
          # module, and provenance generation then dies with
          # `MODULE_NOT_FOUND Cannot find module 'sigstore'`. The warning in
          # the Setup Node step is load-bearing now that provenance is on.
          NPM_CONFIG_PROVENANCE: true
          HUSKY: 0

      # After a real publish, bring `dev` up to the released `main` so the two
      # branches don't drift on version / CHANGELOG / consumed changesets (the
      # recurring "Version Packages landed on main, dev is behind" tax). Tries a
      # direct merge+push; if dev has diverged or is protection-gated, falls
      # back to opening a sync PR instead of failing the (already-done) release.
      - name: Sync dev with released main
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B dev origin/dev
          if git merge --no-edit origin/main && git push origin dev; then
            echo "dev synced to released main."
          else
            echo "Direct sync not possible (divergence or branch protection) — opening a PR."
            git merge --abort 2>/dev/null || true
            gh pr create --base dev --head main \
              --title "chore: sync dev with released main" \
              --body "Auto-opened after a release: brings dev up to the version bump, CHANGELOG, and consumed changesets that landed on main." \
              2>/dev/null || echo "(sync PR already open or not needed)"
          fi

  # Canary (pre-release) publish. Manually dispatched against a branch
  # (usually `dev`) to make an unreleased fix testable before it ships.
  # Publishes a snapshot version (e.g. 0.1.2-canary-20260519123456) under
  # the npm `canary` dist-tag — `latest` is untouched, no git tag, no
  # changelog entry. The pending changesets are NOT consumed: they still
  # flow through the stable `release` job above and become the official
  # version on `latest`.
  canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: canary
    # `environment: release` is required, not cosmetic: npm's Trusted
    # Publisher for this package verifies the workflow file AND the
    # environment, so the OIDC publish only succeeds from here.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24's bundled npm already supports Trusted Publishing — do NOT
      # self-upgrade npm (it drops the bundled `sigstore` module and breaks
      # provenance). See the release job above.

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Require a pending changeset
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::error::No pending changesets — a canary needs at least one unreleased change to publish."
            exit 1
          fi

      - name: "Publish canary to npm (dist-tag: canary)"
        # Provenance on for canaries too, so a tester can verify a canary
        # build with `npm audit signatures` exactly as they would a stable
        # one — a canary that publishes differently from the stable path is
        # a worse rehearsal of it. Same one-way-door caveat: each canary
        # version's attestation is permanent and public.
        env:
          NPM_CONFIG_PROVENANCE: true
        # In pre-mode (`changeset pre enter canary`) `changeset version`
        # was already run locally — the pending changeset got consumed
        # and `package.json` is at `0.3.0-canary.N`. Pre-mode also pins
        # `changeset publish` to its own dist-tag (`canary` here, from
        # pre.json) and rejects an explicit `--tag` and `--snapshot`.
        # So in pre-mode: bare `publish` is correct.
        #
        # Outside pre-mode we want the older snapshot flow — bump to a
        # `0.3.0-canary-<sha>` style version and publish under the
        # canary dist-tag. Detect via `pre.json`.
        run: |
          if [ -f .changeset/pre.json ]; then
            npx changeset publish --no-git-tag
          else
            npx changeset version --snapshot canary
            npx changeset publish --tag canary --no-git-tag
          fi
